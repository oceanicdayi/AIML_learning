name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - app.py
      - requirements.txt
      - deploy.py
      - sitecustomize.py
      - Group*/**
      - .github/workflows/deploy-hf.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deploy dependency
        run: python -m pip install --upgrade "huggingface_hub>=0.25.2,<1.0"

      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: oceanicdayi/AIML_learning
        run: python deploy.py
